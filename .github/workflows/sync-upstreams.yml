name: Follow SFL and reF1nd upstreams

on:
  schedule:
    # Daily at 06:00 Singapore time (22:00 UTC).
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Build even if neither upstream changed
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sync-sfl-ref1nd
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.sync.outputs.revision }}
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve paired stable SFL and reF1nd releases
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/update-stable.py
          git add ref1nd-core.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update pinned reF1nd core'
          fi
          after="$(git rev-parse HEAD)"
          if [[ "$before" != "$after" ]]; then
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$after" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force_build == true
    uses: ./.github/workflows/ref1nd-linux-amd64.yml
    with:
      desktop_ref: ${{ needs.sync.outputs.revision }}
